  <link rel="preconnect" href="https://fonts.googleapis.com" />

</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="images/logo/alloye-icon.png" alt="Alloyé" class="logo-mark" /></a>
      <nav class="main-nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="shop.html?filter=new">New Arrivals</a>
        <a href="shop.html?filter=sets">Collections</a>
        <a href="shop.html?filter=bestseller">Best Sellers</a>
        <a href="about.html">About</a>
      </nav>
      <div class="header-icons">
        <a href="shop.html" aria-label="Search" class="search-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </a>
        <a href="wishlist.html" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span class="icon-badge" id="wishlist-count">0</span>
        </a>
        <a href="account.html" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        </a>
        <a href="cart.html" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
          <span class="icon-badge" id="cart-count">0</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="container">
    <div class="shop-header" style="padding-bottom:0;">
      <h1>Your Wishlist</h1>
    </div>

    <div class="section">
      <div class="product-grid" id="wishlist-grid"></div>
      <div class="empty-state" id="wishlist-empty" style="display:none;">
        <h2>Your wishlist is empty.</h2>
        <p>Save pieces you love to find them here later.</p>
        <a href="shop.html" class="btn btn-primary mt-40">Continue Shopping</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none; padding-top:0;">
        <span>&copy; 2026 Alloyé. All rights reserved.</span>
        <span>Developed by Rifa Tasnim Roza</span>
        <span>Cash on Delivery · bKash (Coming Soon)</span>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderWishlist() {
      const ids = getWishlist();
      const grid = document.getElementById("wishlist-grid");
      const emptyEl = document.getElementById("wishlist-empty");

      if (!ids.length) {
        grid.style.display = "none";
        emptyEl.style.display = "block";
        return;
      }

      grid.style.display = "grid";
      emptyEl.style.display = "none";

      const items = ids.map(getProductById).filter(Boolean);
      grid.innerHTML = items.map(renderProductCard).join("");
    }

    function renderProductCard(p) {
      const badge = p.badge ? `<span class="product-badge">${p.badge}</span>` : "";
      const oldPrice = p.oldPrice ? `<span class="old-price">${formatPrice(p.oldPrice)}</span>` : "";
      return `
        <div class="product-card">
          <a href="product.html?id=${p.id}">
            <div class="product-image">
              ${badge}
              <img src="${p.image}" alt="${p.name}" onerror="this.src='images/products/placeholder.svg'" />
            </div>
          </a>
          <button class="wishlist-toggle active" onclick="handleRemove(event, ${p.id})">&#9825;</button>
          <div class="product-info">
            <a href="product.html?id=${p.id}"><h3>${p.name}</h3></a>
            <p class="price">${oldPrice}${formatPrice(p.price)}</p>
            <div class="product-actions">
              <button class="btn btn-primary btn-block" onclick="addToCart(${p.id}, 1)">Add to Cart</button>
            </div>
          </div>
        </div>
      `;
    }

    function handleRemove(e, id) {
      e.preventDefault();
      toggleWishlist(id);
      renderWishlist();
    }

    loadProducts().then(renderWishlist);
  </script>
</body>
</html>
