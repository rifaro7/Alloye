<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Alloyé</title>
  <meta name="description" content="Your order confirmation from Alloyé." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Order Confirmed — Alloyé" />
  <meta property="og:description" content="Your order confirmation from Alloyé." />
  <meta property="og:image" content="https://alloye.shop/images/hero/hero-banner.webp" />
  <meta property="og:url" content="https://alloye.shop/order-confirmation.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="images/logo/alloye-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/pixel.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="images/logo/alloye-icon.png" alt="Alloyé" class="logo-mark" /></a>
      <nav class="main-nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="shop.html?filter=new">New Arrivals</a>
        <a href="shop.html?filter=sets">Collections</a>
        <a href="shop.html?filter=bestseller">Best Sellers</a>
        <a href="about.html">About</a>
      </nav>
      <div class="header-icons">
        <a href="shop.html" aria-label="Search" class="search-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </a>
        <a href="wishlist.html" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span class="icon-badge" id="wishlist-count">0</span>
        </a>
        <a href="account.html" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        </a>
        <a href="cart.html" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
          <span class="icon-badge" id="cart-count">0</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="container">
    <div id="confirmation-content" style="max-width:640px; margin:0 auto; padding:70px 0;">
      <!-- filled by JS -->
    </div>

    <div id="confirmation-empty" class="empty-state" style="display:none;">
      <h2>No order found.</h2>
      <p>We couldn't find that order.</p>
      <a href="shop.html" class="btn btn-primary mt-40">Continue Shopping</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none; padding-top:0;">
        <span>&copy; 2026 Alloyé. All rights reserved.</span>
        <span>Developed by Rifa Tasnim Roza</span>
        <span>Cash on Delivery · bKash (Coming Soon)</span>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const PAYMENT_LABELS = { cod: "Cash on Delivery" };
    const DELIVERY_LABELS = { inside: "Inside Dhaka (3-5 business days)", outside: "Outside Dhaka (5-7 business days)" };

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order");
    const orders = JSON.parse(localStorage.getItem("alloye_orders") || "[]");
    const order = orders.find((o) => o.id === orderId);

    const contentEl = document.getElementById("confirmation-content");
    const emptyEl = document.getElementById("confirmation-empty");

    if (!order) {
      contentEl.style.display = "none";
      emptyEl.style.display = "block";
    } else {
      trackPixelEvent("Purchase", {
        value: order.total,
        currency: "BDT",
        content_ids: order.items.map((item) => item.id),
        content_type: "product",
        num_items: order.items.reduce((sum, item) => sum + item.qty, 0)
      });

      const itemsHtml = order.items.map((item) => `
        <div class="summary-item">
          <span>${item.name}${item.style ? " — " + item.style : ""} <span class="qty">x${item.qty}</span></span>
          <span>${formatPrice(item.price * item.qty)}</span>
        </div>
      `).join("");

      const estDelivery = order.deliveryMethod === "inside" ? "3-5 business days" : "5-7 business days";
      const addr = order.address;

      contentEl.innerHTML = `
        <div class="text-center" style="margin-bottom:40px;">
          <p class="eyebrow" style="color:var(--color-gold-dark);">Order Confirmed</p>
          <h1 style="font-size:2.2rem; margin:12px 0;">Order #${order.id}</h1>
          <p style="color:var(--color-text-soft);">Thank you for your order, ${order.customer.name}.</p>
        </div>

        <div class="order-summary" style="margin-bottom:24px;">
          <h2>Order Details</h2>
          ${itemsHtml}
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
          <div class="summary-row"><span>Delivery</span><span>${formatPrice(order.delivery)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(order.total)}</span></div>
        </div>

        <div class="pd-meta" style="grid-template-columns: 1fr 1fr; margin-bottom:30px;">
          <span>Payment Method</span><span>${PAYMENT_LABELS[order.paymentMethod]}</span>
          <span>Payment Status</span><span>${order.paymentMethod === "cod" ? "Pending (Cash on Delivery)" : "Pending Confirmation"}</span>
          <span>Delivery Address</span><span>${addr.house}, ${addr.road}, ${addr.area}, ${addr.city}, ${addr.district} ${addr.postalCode}</span>
          <span>Estimated Delivery</span><span>${estDelivery}</span>
        </div>

        <div class="hero-actions" style="justify-content:center;">
          <a href="order-tracking.html?order=${order.id.replace('ALY-', '')}" class="btn btn-outline">Track Order</a>
          <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
        </div>
      `;
    }
  </script>
</body>
</html>
