<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — Alloyé</title>
  <meta name="description" content="Sign in or create your Alloyé account to track orders." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Account — Alloyé" />
  <meta property="og:description" content="Sign in or create your Alloyé account to track orders." />
  <meta property="og:image" content="https://alloye.shop/images/hero/hero-banner.webp" />
  <meta property="og:url" content="https://alloye.shop/account.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="images/logo/alloye-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/pixel.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="images/logo/alloye-icon.png" alt="Alloyé" class="logo-mark" /></a>
      <nav class="main-nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="shop.html?filter=new">New Arrivals</a>
        <a href="shop.html?filter=sets">Collections</a>
        <a href="shop.html?filter=bestseller">Best Sellers</a>
        <a href="about.html">About</a>
      </nav>
      <div class="header-icons">
        <a href="shop.html" aria-label="Search" class="search-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </a>
        <a href="wishlist.html" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span class="icon-badge" id="wishlist-count">0</span>
        </a>
        <a href="account.html" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        </a>
        <a href="cart.html" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
          <span class="icon-badge" id="cart-count">0</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <section class="container">
    <div class="narrow-panel" id="guest-panel">
      <h1 id="panel-title">Sign In</h1>

      <form id="login-form">
        <p id="login-error" style="display:none; color:#b3261e; font-size:0.9rem; margin-bottom:12px;"></p>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
        <p class="text-center" style="margin-top:16px; font-size:0.85rem; color:var(--color-text-soft);">
          New here? <a href="#" id="show-register" style="text-decoration:underline; color:var(--color-text);">Create an account</a>
        </p>
      </form>

      <form id="register-form" style="display:none;">
        <p id="register-error" style="display:none; color:#b3261e; font-size:0.9rem; margin-bottom:12px;"></p>
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" required />
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" required />
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create Account</button>
        <p class="text-center" style="margin-top:16px; font-size:0.85rem; color:var(--color-text-soft);">
          Already have an account? <a href="#" id="show-login" style="text-decoration:underline; color:var(--color-text);">Sign in</a>
        </p>
      </form>
    </div>

    <div class="narrow-panel" id="account-panel" style="display:none; max-width:640px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h1 style="margin:0;">My Account</h1>
        <button class="btn btn-outline" id="logout-btn" style="padding:8px 20px;">Log Out</button>
      </div>
      <p id="welcome-text" style="color:var(--color-text-soft); margin-bottom:32px;"></p>

      <h2 style="font-size:1.3rem; margin-bottom:16px;">My Orders</h2>
      <div id="orders-loading">Loading your orders...</div>
      <div id="orders-list"></div>
      <div id="orders-empty" style="display:none; color:var(--color-text-soft);">You haven't placed any orders yet.</div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none; padding-top:0;">
        <span>&copy; 2026 Alloyé. All rights reserved.</span>
        <span>Cash on Delivery · bKash (Coming Soon)</span>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const WC_SITE = "https://cms.alloye.shop";
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const panelTitle = document.getElementById("panel-title");

    document.getElementById("show-register").addEventListener("click", (e) => {
      e.preventDefault();
      loginForm.style.display = "none";
      registerForm.style.display = "block";
      panelTitle.textContent = "Create Account";
    });

    document.getElementById("show-login").addEventListener("click", (e) => {
      e.preventDefault();
      registerForm.style.display = "none";
      loginForm.style.display = "block";
      panelTitle.textContent = "Sign In";
    });

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const errorEl = document.getElementById("login-error");
      errorEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Signing In...";

      try {
        const res = await fetch(`${WC_SITE}/wp-json/jwt-auth/v1/token`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPassword").value
          })
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.message || "Invalid email or password.");

        localStorage.setItem("alloye_token", result.token);
        localStorage.setItem("alloye_user_name", result.user_display_name || result.user_nicename || "");
        showAccountPanel();
      } catch (err) {
        errorEl.textContent = err.message.replace(/<[^>]*>/g, "");
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });

    registerForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = document.getElementById("register-btn");
      const errorEl = document.getElementById("register-error");
      errorEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Creating Account...";

      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;

      try {
        const res = await fetch("register.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("registerName").value,
            email: email,
            password: password
          })
        });
        const result = await res.json();
        if (!res.ok || !result.success) throw new Error(result.error || "Could not create account.");

        // Auto sign-in right after registering
        const loginRes = await fetch(`${WC_SITE}/wp-json/jwt-auth/v1/token`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: email, password: password })
        });
        const loginResult = await loginRes.json();
        if (loginRes.ok) {
          localStorage.setItem("alloye_token", loginResult.token);
          localStorage.setItem("alloye_user_name", loginResult.user_display_name || "");
          showAccountPanel();
        } else {
          // Account created but auto-login failed — send them to sign in manually
          registerForm.style.display = "none";
          loginForm.style.display = "block";
          panelTitle.textContent = "Sign In";
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("alloye_token");
      localStorage.removeItem("alloye_user_name");
      document.getElementById("account-panel").style.display = "none";
      document.getElementById("guest-panel").style.display = "block";
    });

    async function showAccountPanel() {
      document.getElementById("guest-panel").style.display = "none";
      const panel = document.getElementById("account-panel");
      panel.style.display = "block";

      const name = localStorage.getItem("alloye_user_name") || "";
      document.getElementById("welcome-text").textContent = name ? `Welcome back, ${name}.` : "Welcome back.";

      const loadingEl = document.getElementById("orders-loading");
      const listEl = document.getElementById("orders-list");
      const emptyEl = document.getElementById("orders-empty");
      loadingEl.style.display = "block";
      listEl.innerHTML = "";
      emptyEl.style.display = "none";

      try {
        const res = await fetch("my-orders.php", {
          headers: { Authorization: "Bearer " + localStorage.getItem("alloye_token") }
        });
        const result = await res.json();

        if (!res.ok) {
          if (res.status === 401) {
            localStorage.removeItem("alloye_token");
            document.getElementById("account-panel").style.display = "none";
            document.getElementById("guest-panel").style.display = "block";
            return;
          }
          throw new Error(result.error || "Could not load orders.");
        }

        loadingEl.style.display = "none";

        if (result.name) {
          localStorage.setItem("alloye_user_name", result.name);
          document.getElementById("welcome-text").textContent = `Welcome back, ${result.name}.`;
        }

        if (!result.orders.length) {
          emptyEl.style.display = "block";
          return;
        }

        listEl.innerHTML = result.orders.map((order) => {
          const itemsText = order.items.map((i) => `${i.name} x${i.quantity}`).join(", ");
          const date = new Date(order.date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
          return `
            <div style="border:1px solid var(--color-border); padding:18px 20px; margin-bottom:12px;">
              <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                <strong>Order #${order.id}</strong>
                <span style="text-transform:capitalize; color:var(--color-text-soft);">${order.status}</span>
              </div>
              <div style="font-size:0.88rem; color:var(--color-text-soft); margin-bottom:6px;">${date}</div>
              <div style="font-size:0.9rem; margin-bottom:6px;">${itemsText}</div>
              <div style="font-weight:500;">${formatPrice(order.total)}</div>
            </div>
          `;
        }).join("");
      } catch (err) {
        loadingEl.style.display = "none";
        listEl.innerHTML = `<p style="color:#b3261e;">${err.message}</p>`;
      }
    }

    // If already logged in, skip straight to the account panel
    if (localStorage.getItem("alloye_token")) {
      showAccountPanel();
    }
  </script>
</body>
</html>
